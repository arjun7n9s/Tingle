name: Tingle watchdog tick

# Hourly ping of the hosted API. Secret is required so a public fork cannot
# spend Bright Data credits. Mock/local still uses prove:tingle-watchdog.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  tick:
    if: github.repository_owner == 'arjun7n9s' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: POST /internal/tick
        env:
          TINGLE_API_URL: ${{ secrets.TINGLE_API_URL }}
          TINGLE_CRON_SECRET: ${{ secrets.TINGLE_CRON_SECRET }}
        run: |
          if [ -z "$TINGLE_API_URL" ]; then
            echo "TINGLE_API_URL secret not set — skip hosted tick"
            exit 0
          fi
          curl -fsS -X POST "$TINGLE_API_URL/internal/tick" \
            -H "Authorization: Bearer $TINGLE_CRON_SECRET" \
            -H "Content-Type: application/json"
